version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: famas-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: famas
    volumes:
      - famas_mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: famas-mongo-express
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb

volumes:
  famas_mongo_data:
    driver: local
